# Pipeline CI/CD automatisé pour OC-Lettings-Site
# Tests → Build Docker multi-arch → Déploiement Render
name: CI/CD Pipeline

# Déclencheurs : push main/develop, PR vers main, manuel
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Variables globales réutilisables dans tous les jobs
env:
  PYTHON_VERSION: '3.9'
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: francoiskrukly
  IMAGE_NAME: oc-lettings-site

jobs:
  # JOB 1: Tests, linting et validation de la qualité de code
  test:
    name: Tests, Linting et Coverage
    runs-on: ubuntu-latest
    
    # Configuration Django pour les tests (pas de production)
    env:
      DEBUG: 'False'
      SECRET_KEY: 'test-secret-key-for-ci-cd-only-not-production'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
    
    steps:
    # Récupération du code source depuis le repository
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Installation Python avec cache pip pour accélération
    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    # Installation de toutes les dépendances du projet
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # Vérification conformité PEP8 avec statistiques détaillées
    - name: Lint with flake8
      run: flake8 --statistics --show-source
        
    # Création des dossiers requis et validation configuration Django
    - name: Prepare Django environment
      run: |
        mkdir -p logs static staticfiles
        python manage.py check
        
    # Exécution des tests avec mesure de couverture de code
    - name: Run tests with coverage
      run: |
        coverage run -m pytest -v
        coverage report
        coverage html
        
    # Sauvegarde du rapport de couverture HTML (téléchargeable 7 jours)
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: coverage-report-${{ github.run_number }}
        path: htmlcov/
        retention-days: 7
        
    # Test de collecte des fichiers statiques (simulation production)
    - name: Collect static files
      run: python manage.py collectstatic --noinput
        
    # Commentaire automatique sur les Pull Requests avec résultats
    - name: Comment PR
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Tests et linting passés avec succès ! La couverture de code est supérieure à 80%.'
          })

  # JOB 2: Build Docker multi-architecture et push vers Docker Hub
  # Exécuté uniquement sur push vers main après succès des tests
  docker:
    name: Build et Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    # Récupération du code pour le build Docker
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Configuration Docker Buildx pour builds multi-architecture optimisés
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host
        buildkitd-flags: --allow-insecure-entitlement security.insecure
      
    # Authentification Docker Hub avec token sécurisé
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    # Génération automatique des tags Docker à partir des métadonnées Git
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    # Build et push image Docker multi-architecture avec cache intelligent
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  # JOB 3: Déploiement automatique sur Render
  # Exécuté uniquement après succès des tests et build Docker
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    # Déclenchement du déploiement via webhook Render sécurisé
    - name: Deploy to Render
      run: |
        response=$(curl -s -w "%{http_code}" -o /tmp/deploy_response.json \
          -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
        
        if [ "$response" = "200" ] || [ "$response" = "201" ]; then
          cat /tmp/deploy_response.json
        else
          echo "Erreur déploiement - Code HTTP: $response"
          cat /tmp/deploy_response.json || echo "Aucune réponse"
          exit 1
        fi
    
    # Vérification de la disponibilité de l'application déployée
    - name: Wait for deployment
      run: |
        sleep 60
        
        for i in {1..10}; do
          if curl -f -s --max-time 10 https://oc-lettings-siteeur.onrender.com/ > /dev/null; then
            echo "✅ Application déployée et accessible"
            break
          else
            sleep 30
          fi
          
          if [ $i -eq 10 ]; then
            echo "⚠️ Vérifiez: https://oc-lettings-siteeur.onrender.com"
          fi
        done